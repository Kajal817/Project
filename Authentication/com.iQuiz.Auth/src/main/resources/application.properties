spring.application.name=auth-service
server.port=49152

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serverUrl.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.keys.current=key123
jwt.keys.key123=YourVerySecureKeyWithASCIIChars1234567890
jwt.keys.key122=YourOldSecureKeyHere

app.jwt.expiration=1800000
app.session.cleanupInterval=300000
logging.level.org.springframework.security=DEBUG
spring.main.web-application-type=reactive
spring.main.allow-bean-definition-overriding=true

