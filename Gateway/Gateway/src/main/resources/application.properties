# Gateway configuration
spring.application.name=Gateway
server.port=8081

# Eureka client configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Enable service discovery routing in Gateway
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Set web application type to reactive
spring.main.web-application-type=reactive

# Swagger UI aggregation (integrating docs for multiple services)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/auth-service/v3/api-docs


# Actuator and management configuration for Gateway
management.endpoints.web.exposure.include=gateway
management.endpoint.gateway.enabled=true

# Enable API docs for the Gateway
springdoc.api-docs.enabled=true

# Routing configuration for auth-service and user-service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth-service/**

# Optional: if you'd like to expose your Gateway's own API docs
springdoc.swagger-ui.urls[1].name=gateway-service
springdoc.swagger-ui.urls[1].url=/v3/api-docs



